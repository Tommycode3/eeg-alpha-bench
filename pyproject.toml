[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-alpha-bench"
version = "0.1.0"
description = "Reproducible eyes-open vs eyes-closed alpha (Berger effect) benchmark for any EEG device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tommaso Maggiolo" }]
keywords = ["EEG", "alpha", "Berger effect", "signal quality", "neurotechnology", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "mne>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alphabench = "alphabench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
